<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preventivo Rete Marconi</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f4f7fb;
  --surface: #ffffff;
  --surface2: #eef3ff;
  --border: #d6e0ff;

  --accent: #3366ff;
  --accent2: #ffcc00;

  --text: #1a1a1a;
  --text-muted: #555;
  --text-dim: #888;

  --green: #28c76f;
  --orange: #ff9f43;
}

body {
  margin:0;
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

header {
  background: white;
  border-bottom: 3px solid var(--accent);
  padding: 20px;
}

h1 { margin:0; }

.summary-card {
  background: white;
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

.table-wrap {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  margin-bottom: 30px;
}

table { width:100%; border-collapse: collapse; }

th, td { padding:10px; }

th {
  background: var(--accent);
  color: white;
}

tbody tr:nth-child(even) {
  background: #f8faff;
}

</style>
</head>

<body>

<header>
  <div class="container">
    <h1>Preventivo Rete Marconi</h1>
  </div>
</header>

<div class="container">

<h2>Riepilogo</h2>
<div class="summary-card" id="totale"></div>

<h2>Articoli</h2>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Nome</th>
<th>Qtà</th>
<th>Unitario</th>
<th>Totale</th>
</tr>
</thead>
<tbody id="tabella"></tbody>
</table>
</div>

<h2>Componenti Rack</h2>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Componente</th>
<th>Prezzo</th>
</tr>
</thead>
<tbody id="rack"></tbody>
<tfoot>
<tr>
<td>Totale Rack</td>
<td id="rackTot"></td>
</tr>
</tfoot>
</table>
</div>

</div>

<script>

const rackComponents = [
  { name: "Pannello Patch Cat6", unit: 79 },
  { name: "Switch 48 Porte", unit: 1199 },
  { name: "MTP Jumper", unit: 312 },
  { name: "QSFP", unit: 37 },
  { name: "UPS", unit: 1005 },
  { name: "Multipresa Rack", unit: 27.86 },
  { name: "Armadio 15U", unit: 407 }
];

const rackQty = 22;

const rackUnit = rackComponents.reduce((s,x)=>s+x.unit,0);
const rackTotal = rackUnit * rackQty;

const articoli = [
  { name:"PC", qty:529, unit:865.35 },
  { name:"NAS", qty:2, unit:662.21 },
  { name:"Rack", qty:rackQty, unit:rackUnit }
];

const tbody = document.getElementById("tabella");
let totale = 0;

articoli.forEach(a=>{
  const t = a.qty * a.unit;
  totale += t;
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${a.name}</td><td>${a.qty}</td><td>€ ${a.unit.toFixed(2)}</td><td>€ ${t.toFixed(2)}</td>`;
  tbody.appendChild(tr);
});

const rackBody = document.getElementById("rack");
rackComponents.forEach(c=>{
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${c.name}</td><td>€ ${c.unit.toFixed(2)}</td>`;
  rackBody.appendChild(tr);
});

document.getElementById("rackTot").textContent = "€ " + rackUnit.toFixed(2);

document.getElementById("totale").textContent = "Totale: € " + totale.toFixed(2);

</script>

</body>
</html>
